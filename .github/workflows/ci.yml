name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx redis asyncpg "sqlalchemy[asyncio]" python-dotenv structlog pytest pytest-asyncio "fakeredis[lua]" respx ruff
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
